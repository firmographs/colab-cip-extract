[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-cip-extract"
version = "0.1.0"
description = "CIP extraction pipeline — replaces Perplexity with Claude + deterministic Python"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pdfplumber>=0.10",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cip = "cip_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cip_tools*"]
